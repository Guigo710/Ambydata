name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Só cancela runs antigos de PR; pushes na main sempre terminam.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Descobre quais lados do monorepo mudaram. Mudanças no próprio workflow
  # disparam os dois lados.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # O MongoDB dos testes vem do Testcontainers (Docker já existe no runner).
    env:
      # 32+ caracteres: o JJWT rejeita chaves HMAC-SHA256 menores que 256 bits.
      JWT_SECRET: segredo-apenas-para-o-ci-nao-usar-em-producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Não bloqueante até o módulo identity reescrever Login, Sidebar e Painel.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build

  # Único check obrigatório na proteção da main. Falha se qualquer job anterior
  # falhou ou foi cancelado; jobs pulados por não haver mudança no lado contam
  # como aprovados. Sem ele, uma falha em "changes" pularia backend e frontend
  # e o PR ficaria mergeável sem build nem testes.
  ci-ok:
    needs: [changes, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '! ${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}'
